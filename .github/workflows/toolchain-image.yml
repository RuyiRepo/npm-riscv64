name: build toolchain images

# The toolchain images are built once and pulled by build.yml. Building them inside
# every matrix job means paying ~10 minutes of emulated apt installs per recipe,
# and it also hides failures: `docker build` can exit 0 while leaving the image
# only in the buildx cache, which makes the next `docker run` fail with a
# confusing "Unable to find image locally".
#
# Two variants exist, matching the `toolchain:` value of a recipe:
#   riscv64 - runs natively on riscv64 (qemu): the default, used by native recipes
#   cross   - amd64 image with the riscv64 cross toolchain, used by cross recipes
#
# Run it manually after changing docker/*.Dockerfile, or build and push the same
# tags from a local docker (see README, "Container images").

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag for the riscv64 image (default: the moving riscv64 tag)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build and push ${{ matrix.suffix }} toolchain image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: riscv64
            dockerfile: docker/riscv64-toolchain.Dockerfile
            platform: linux/riscv64
          - suffix: cross
            dockerfile: docker/riscv64-cross.Dockerfile
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Prepare riscv64 emulation
        if: matrix.platform == 'linux/riscv64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      # Pushing to GHCR needs write access to the *package*, not just
      # `packages: write` in the workflow: GitHub grants the repository token write
      # access only when the package is linked to this repository. A package created
      # by a manual push from a laptop (with a personal token) is not linked, and
      # the push then fails with "denied: permission_denied: read_package".
      #
      # Two ways out: link the package (Package settings -> Manage Actions access ->
      # add this repository with the Write role), or - what this step prefers - give
      # the workflow a classic PAT with `write:packages` as the GHCR_TOKEN secret. A
      # PAT does not depend on the link, so it also survives the package being
      # deleted and recreated.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${GHCR_TOKEN:-}" ]; then
            echo "logging in with the GHCR_TOKEN secret (PAT with write:packages)"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          else
            echo "no GHCR_TOKEN secret set: using the workflow token, which needs the"
            echo "package to be linked to this repository (see the comment above)"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi

      - name: Build and push
        env:
          EXTRA_TAG: ${{ inputs.tag }}
          SUFFIX: ${{ matrix.suffix }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # GHCR rejects uppercase repository names, so lowercase the owner.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/npm-riscv64-toolchain"
          tags=(
            --tag "$image:$SUFFIX"
            --tag "$image:sha-${GITHUB_SHA:0:12}-$SUFFIX"
          )
          # The extra tag is a convenience handle for the default variant; the cross
          # variant is addressed by its own suffix tag and by the sha tag.
          if [ -n "${EXTRA_TAG:-}" ] && [ "$SUFFIX" = "riscv64" ]; then
            tags+=(--tag "$image:$EXTRA_TAG")
          fi
          echo "pushing:"
          printf '  %s\n' "${tags[@]}"
          # --push is what makes the result leave the build cache. Without it the
          # step can succeed while publishing nothing, and the next `docker run`
          # fails with "Unable to find image locally".
          # The source label is what makes GHCR link the package to this
          # repository. Without the link the repository token keeps read-only access,
          # which is the "permission_denied: read_package" push failure. It is spelled
          # out here instead of in the Dockerfile because every fork pushes into its
          # own namespace.
          docker buildx build \
            --platform "$PLATFORM" \
            --file "$DOCKERFILE" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${tags[@]}" \
            --push .
